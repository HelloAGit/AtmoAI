[project]
name = "atmos-vision"
version = "0.1.0"
description = "Atmospheric analysis from outdoor imagery using CV, EXIF solar math, and meteorological fusion."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pillow>=10.3.0",
    "exifread>=3.0.0",
    "astral>=3.2",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "torch>=2.3.0",
    "timm>=1.0.3",
    "streamlit>=1.35.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
